---
layout: base
---
<!-- Blog Post Content -->
<div class="untree_co-section">
    <div class="container">
        <!-- Blog Post Title -->
        <div class="d-flex align-items-center justify-content-between mb-4">
            <h1 class="heading mb-0">{{ page.title }}</h1>
            {% if page.project and page.project != 'none' %}
            <img src="{{ site.data.project[page.project].icon | relative_url }}" 
                 alt="{{ site.data.project[page.project].name }}" 
                 title="Part of {{ site.data.project[page.project].name }}"
                 class="project-icon">
            {% endif %}
        </div>

        <!-- Blog Post Meta Information (Optional) -->
        <div class="post-meta mb-4">
            <span class="date">{{ page.date | date: "%B %d, %Y" }}</span>
        </div>

        <!-- Blog Post Content -->
        <div class="post-content">
            {{ page.content }}
        </div>
    </div>
</div>
